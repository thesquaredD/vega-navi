<!DOCTYPE html>
<html class="preload" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta http-equiv="X-UA-Compatibility" content="IE=Edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="Jellyfin">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">

    <meta id="themeColor" name="theme-color" content="#202020">

    <link rel="apple-touch-icon" sizes="180x180" href="../node_modules/@jellyfin/ux-web/favicons/touchicon.png">
    <link rel="shortcut icon" href="../node_modules/@jellyfin/ux-web/favicons/favicon.ico">
    <meta name="msapplication-TileImage" content="../node_modules/@jellyfin/ux-web/favicons/touchicon144.png">
    <meta name="msapplication-TileColor" content="#333333">

    <title>Jellyfin</title>

    <!-- VegaNAVI fork: Bricolage Grotesque variable font (optical size + weight axes). -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">

    <style>
        .transparentDocument,
        .backgroundContainer-transparent:not(.withBackdrop) {
            background: none !important;
            background-color: transparent !important;
        }

        .layout-tv .mouseIdle,
        .layout-tv .mouseIdle button,
        .layout-tv .mouseIdle select,
        .layout-tv .mouseIdle input,
        .layout-tv .mouseIdle textarea,
        .layout-tv .mouseIdle a,
        .layout-tv .mouseIdle label,
        .transparentDocument .mouseIdle,
        .transparentDocument .mouseIdle button,
        .transparentDocument .mouseIdle select,
        .transparentDocument .mouseIdle input,
        .transparentDocument .mouseIdle textarea,
        .transparentDocument .mouseIdle a,
        .transparentDocument .mouseIdle label,
        .screensaver-noScroll.mouseIdle,
        .screensaver-noScroll.mouseIdle button,
        .screensaver-noScroll.mouseIdle select,
        .screensaver-noScroll.mouseIdle input,
        .screensaver-noScroll.mouseIdle textarea,
        .screensaver-noScroll.mouseIdle a,
        .screensaver-noScroll.mouseIdle label {
            cursor: none !important;
        }

        .preload {
            background-color: #101010;
        }

        /* VegaNAVI splash wordmark — overrides the default Jellyfin logo from site.scss. */
        .splashLogo {
            background-image: none !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            font-family: 'Arial Narrow', Arial, sans-serif;
            font-stretch: 75%;
            font-size: 6vw;
            line-height: 1;
            letter-spacing: 0.01em;
            color: #f6fbff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
        }

        .splashLogo-vega { font-weight: 400; }
        .splashLogo-navi { font-weight: 600; }

        @media screen and (min-device-width: 992px) {
            .splashLogo { background-image: none !important; }
        }

        .hide,
        .layout-desktop .hide-desktop,
        .layout-mobile .hide-mobile,
        .layout-tv .hide-tv,
        .mouseIdle .hide-mouse-idle,
        .mouseIdle-tv .hide-mouse-idle-tv {
            display: none !important;
        }

        .mainDrawerHandle {
            position: fixed;
            top: 0;
            bottom: 0;
            z-index: 1;
            width: 0.8em;
            padding-left: env(safe-area-inset-left);
            caret-color: transparent;
        }

        [dir="ltr"] .mainDrawerHandle {
            left: 0;
        }

        [dir="rtl"] .mainDrawerHandle {
            left: 0;
        }
    </style>
</head>
<body dir="ltr">
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
        <defs>
            <!--
                Liquid-glass displacement filter.
                primitiveUnits=objectBoundingBox so coords scale with the host element.
                Turbulence makes a smooth low-frequency noise field; we blur it to soften
                and use it as the displacement map for the backdrop. No baked geometry,
                no fixed shape — works on any element regardless of size or aspect ratio.
            -->
            <filter id="liquid-glass" primitiveUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
                <feTurbulence type="turbulence" baseFrequency="2.2 5" numOctaves="2" seed="2" result="noise"/>
                <feGaussianBlur in="noise" stdDeviation="0.03" result="smooth"/>
                <feComponentTransfer in="smooth" result="map">
                    <feFuncR type="linear" slope="2" intercept="-0.5"/>
                    <feFuncG type="linear" slope="2" intercept="-0.5"/>
                </feComponentTransfer>
                <feDisplacementMap in="SourceGraphic" in2="map" scale="0.06" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>
    <div id="reactRoot">
        <div class="splashLogo"><span class="splashLogo-vega">Vega</span><span class="splashLogo-navi">NAVI</span></div>
    </div>
</body>
</html>
